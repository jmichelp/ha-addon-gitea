# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Gitea
version: "0.3.1"
slug: gitea
description: Self-hosted Git service with code repositories, issues, and pull requests
url: "https://github.com/jmichelp/ha-addon-gitea"
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: "mdi:git"
panel_title: "Gitea"
map:
  - share:rw
  - ssl:ro
options:
  domain: homeassistant.local
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  use_nginx: false
  ssh_server: builtin
  password_check_pwn: false
  disable_registration: false
  require_signin_view: false
  mailer_enabled: false
  mailer_protocol: starttls
  mailer_smtp_addr: ""
  mailer_smtp_port: 587
  mailer_user: ""
  mailer_password: ""
  mailer_from: ""
  mailer_helo_hostname: ""
  mailer_force_trust_cert: false
  register_email_confirm: false
  captcha_enabled: false
  captcha_type: image
  captcha_for_login: false
  recaptcha_sitekey: ""
  recaptcha_secret: ""
  recaptcha_url: "https://www.google.com/recaptcha/"
  hcaptcha_sitekey: ""
  hcaptcha_secret: ""
  mcaptcha_sitekey: ""
  mcaptcha_secret: ""
  mcaptcha_url: "https://demo.mcaptcha.org/"
  cf_turnstile_sitekey: ""
  cf_turnstile_secret: ""
schema:
  domain: match(^[a-zA-Z0-9.-]{1,253}$)
  ssl: bool
  certfile: str
  keyfile: str
  root_url: str?
  use_nginx: bool
  ssh_server: list(builtin|openssh)?
  password_check_pwn: bool?
  disable_registration: bool?
  require_signin_view: bool?
  mailer_enabled: bool?
  mailer_protocol: list(smtp|smtps|starttls|sendmail|dummy)?
  mailer_smtp_addr: str?
  mailer_smtp_port: port?
  mailer_user: str?
  mailer_password: password?
  mailer_from: str?
  mailer_helo_hostname: str?
  mailer_force_trust_cert: bool?
  register_email_confirm: bool?
  captcha_enabled: bool?
  captcha_type: list(image|recaptcha|hcaptcha|mcaptcha|cfturnstile)?
  captcha_for_login: bool?
  recaptcha_sitekey: str?
  recaptcha_secret: password?
  recaptcha_url: str?
  hcaptcha_sitekey: str?
  hcaptcha_secret: password?
  mcaptcha_sitekey: str?
  mcaptcha_secret: password?
  mcaptcha_url: str?
  cf_turnstile_sitekey: str?
  cf_turnstile_secret: password?
ports:
  2222/tcp: 3022
  3000/tcp: 3000
ports_description:
  2222/tcp: "Git SSH Interface"
  3000/tcp: "Gitea Web Interface"
image: "ghcr.io/jmichelp/app-gitea"
stage: experimental
