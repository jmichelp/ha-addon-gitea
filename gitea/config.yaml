# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Gitea
version: "0.2.4"
slug: gitea
description: Self-hosted Git service with code repositories, issues, and pull requests
url: "https://github.com/jmichelp/ha-addon-gitea"
arch:
  - aarch64
  - amd64
init: false
ingress: true
panel_icon: "mdi:git"
panel_title: "Gitea"
map:
  - share:rw
  - ssl:ro
options:
  domain: homeassistant.local
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  use_nginx: false
schema:
  domain: match(^[a-zA-Z0-9.-]{1,253}$)
  ssl: bool
  certfile: str
  keyfile: str
  root_url: str?
  use_nginx: bool
ports:
  2222/tcp: 3022
  3000/tcp: 3000
ports_description:
  2222/tcp: "Git SSH Interface"
  3000/tcp: "Gitea Web Interface"
image: "ghcr.io/jmichelp/app-gitea"
stage: experimental
