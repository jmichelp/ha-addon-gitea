# WebSocket upgrade mapping
map $http_upgrade $gitea_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    server_name __DOMAIN__;

    ssl_certificate /ssl/fullchain.pem;
    ssl_certificate_key /ssl/privkey.pem;

    listen 443 ssl;
    http2 on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss application/atom+xml image/svg+xml;

    # Gitea static assets caching
    location ^~ /assets/ {
        client_max_body_size 512M;

        proxy_pass http://127.0.0.1:__GITEA_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Connection $gitea_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 128k;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Gitea web interface and Git HTTP
    location / {
        client_max_body_size 512M;

        proxy_pass http://127.0.0.1:__GITEA_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Connection $gitea_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 128k;
    }
}